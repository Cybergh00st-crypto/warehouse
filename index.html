<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2a43">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مخازن الجوهرة">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>مخازن الجوهرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0f2a43; --navy2:#173a5c; --teal:#0e7c86; --gold:#c9a227; --gold2:#f4e6b0;
  --bg:#f3f5f8; --card:#fff; --ink:#142235; --mut:#6b7a8c; --line:#e3e8ee;
  --ok:#1c9c5b; --okbg:#e5f6ed; --bad:#d6453d; --badbg:#fdeceb; --warn:#b7791f; --warnbg:#fff4dc;
  --r:16px; --sh:0 2px 10px rgba(15,42,67,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:16px}
button,input,select{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:0}
#app{min-height:100vh;max-width:820px;margin:0 auto}
.demo{background:var(--warnbg);color:var(--warn);font-size:13px;padding:6px 12px;text-align:center;font-weight:600}

/* ---------- pick / role screens ---------- */
.hero{background:linear-gradient(160deg,var(--navy),var(--navy2));color:#fff;padding:36px 20px 56px;text-align:center;border-radius:0 0 28px 28px}
.logo{width:64px;height:64px;margin:0 auto 10px;border-radius:18px;background:var(--gold);display:grid;place-items:center;font-size:32px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.hero h1{margin:0;font-size:26px;font-weight:800}
.hero p{margin:6px 0 0;opacity:.8;font-size:15px}
.pickwrap{padding:0 16px;margin-top:-34px}
.pcard{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh);text-align:right;color:var(--ink);border:2px solid transparent;transition:.15s}
.pcard:active{transform:scale(.98)}
.pcard:hover{border-color:var(--gold)}
.pnum{width:44px;height:44px;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.pcard b{font-size:19px;display:block}
.pcard small{color:var(--mut)}
.pcard .ar{margin-right:auto;color:var(--gold);font-size:22px}
.back{background:none;color:#fff;font-size:15px;opacity:.9;padding:4px 0;margin-bottom:8px;display:block;text-align:right}
.rolebox{padding:0 16px;margin-top:-34px;display:grid;gap:12px}
.rcard{background:var(--card);border-radius:var(--r);padding:22px 16px;box-shadow:var(--sh);text-align:center;color:var(--ink);border:2px solid transparent}
.rcard:hover{border-color:var(--gold)}
.rcard .ic{font-size:38px}
.rcard b{display:block;font-size:20px;margin-top:4px}
.rcard small{color:var(--mut)}

/* ---------- main ---------- */
.top{background:var(--navy);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
.top .brand{font-weight:800;font-size:18px;flex:1;display:flex;align-items:center;gap:8px}
.top .brand i{font-style:normal;background:var(--gold);color:var(--navy);width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px}
.pill{font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.14)}
.pill.mgr{background:var(--gold);color:var(--navy)}
.ibtn{position:relative;background:rgba(255,255,255,.12);color:#fff;width:38px;height:38px;border-radius:12px;font-size:18px;display:grid;place-items:center}
.badge{position:absolute;top:-5px;left:-5px;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid var(--navy)}
.chips{display:flex;gap:8px;padding:12px 14px 4px;overflow-x:auto}
.chip{flex:1;text-align:center;background:var(--card);color:var(--ink);border-radius:99px;padding:9px 4px;font-weight:700;font-size:13px;box-shadow:var(--sh);border:2px solid transparent;white-space:nowrap}
.chip.on{background:var(--navy);color:var(--gold);border-color:var(--navy)}
.tools{display:flex;gap:8px;padding:8px 14px}
.sbox{flex:1;position:relative}
.sbox input{width:100%;padding:12px 40px 12px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;outline:0}
.sbox input:focus{border-color:var(--teal)}
.sbox span{position:absolute;right:13px;top:50%;transform:translateY(-50%);opacity:.5}
.addb{background:var(--gold);color:var(--navy);font-weight:800;border-radius:14px;padding:0 14px;white-space:nowrap}
.meta{padding:2px 16px 6px;color:var(--mut);font-size:13px}
#content{padding:6px 14px 170px}
.lowbar{display:block;width:100%;text-align:right;background:var(--warnbg);color:var(--warn);font-weight:800;border-radius:14px;padding:12px 14px;margin-bottom:10px;border:1.5px solid #f0d9a0}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px;box-shadow:var(--sh);border:2px solid transparent}
.row.sel{border-color:var(--teal);background:#f1fafb}
.row.low{border-right:5px solid var(--warn)}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis}
.row .nm small{color:var(--mut)}
.tag{display:inline-block;margin-right:6px;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:800;background:var(--warnbg);color:var(--warn)}
.tag.zero{background:var(--badbg);color:var(--bad)}
.av{text-align:center;min-width:52px}
.av small{display:block;color:var(--mut);font-size:11px}
.av b{font-size:18px}
.av.zero b{color:var(--bad)}
.av.lowq b{color:var(--warn)}
.step{display:flex;align-items:center;gap:4px}
.step button{width:34px;height:34px;border-radius:10px;background:var(--navy);color:#fff;font-size:20px;line-height:1}
.step button:disabled{opacity:.25}
.step input{width:52px;text-align:center;padding:7px 2px;border-radius:10px;border:1.5px solid var(--line);font-weight:800}
.act{display:flex;gap:6px}
.act button{width:36px;height:36px;border-radius:10px;background:#eef2f6;font-size:16px}
.act .del{background:var(--badbg)}
.empty{text-align:center;color:var(--mut);padding:50px 20px}
.empty .big{font-size:44px}
.bar{position:fixed;bottom:62px;left:0;right:0;max-width:820px;margin:0 auto;padding:10px 14px;background:linear-gradient(transparent,var(--bg) 35%);display:flex;gap:8px;z-index:15}
.bar .ok{flex:1;background:var(--ok);color:#fff;font-weight:800;font-size:18px;padding:14px;border-radius:14px;box-shadow:0 6px 16px rgba(28,156,91,.35)}
.bar .clr{background:#fff;color:var(--bad);font-weight:700;padding:0 16px;border-radius:14px;box-shadow:var(--sh)}
.tabs{position:fixed;bottom:0;left:0;right:0;max-width:820px;margin:0 auto;background:#fff;display:flex;border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;background:none;padding:10px 2px 8px;color:var(--mut);font-weight:700;font-size:12px;position:relative}
.tabs button .t{font-size:20px;display:block}
.tabs button.on{color:var(--navy)}
.tabs button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;background:var(--gold);border-radius:0 0 4px 4px}
.tabs .badge{top:4px;left:calc(50% - 30px);border-color:#fff}

/* requests + log */
.fl{display:flex;gap:6px;padding:8px 0}
.fl button{flex:1;background:#fff;border-radius:12px;padding:9px 4px;font-weight:700;font-size:13px;color:var(--mut);box-shadow:var(--sh)}
.fl button.on{background:var(--navy);color:var(--gold)}
.rq{background:var(--card);border-radius:14px;padding:13px;margin-bottom:10px;box-shadow:var(--sh);border-right:5px solid var(--warn)}
.rq.approved{border-right-color:var(--ok)}
.rq.rejected{border-right-color:var(--bad)}
.rq .h{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mut);margin-bottom:6px}
.rq .tx{font-weight:700;line-height:1.7}
.rq .by{font-size:13px;color:var(--mut);margin-top:4px}
.rq .st{display:inline-block;margin-top:8px;padding:3px 12px;border-radius:99px;font-size:13px;font-weight:800}
.st.pending{background:var(--warnbg);color:var(--warn)}
.st.approved{background:var(--okbg);color:var(--ok)}
.st.rejected{background:var(--badbg);color:var(--bad)}
.rq .bt{display:flex;gap:8px;margin-top:10px}
.lg{border-right-color:var(--teal)}
.lg.withdraw{border-right-color:var(--bad)}
.lg.add{border-right-color:var(--ok)}
.lg.reject{border-right-color:var(--mut)}
.exp{display:flex;gap:8px;margin-bottom:10px}
.btn{padding:12px 16px;border-radius:12px;font-weight:800;background:#e8edf2;color:var(--ink)}
.btn.pri{background:var(--navy);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.fl1{flex:1}
.btn.wide{width:100%;margin-bottom:10px}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(10,20,35,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fi .15s}
@media(min-width:600px){.ov{align-items:center}}
.box{background:#fff;width:100%;max-width:440px;border-radius:22px 22px 0 0;padding:20px;animation:up .2s;max-height:90vh;overflow:auto}
@media(min-width:600px){.box{border-radius:22px}}
.box h3{margin:0 0 12px;font-size:20px}
.mb label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px;font-weight:600}
.mb input{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);outline:0}
.mb input:focus{border-color:var(--teal)}
.mb .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mb p{margin:0;line-height:1.7}
.mb .err{color:var(--bad);font-weight:700;font-size:14px;margin-top:8px;min-height:20px}
.wch{display:flex;flex-wrap:wrap;gap:8px}
.wc{padding:10px 16px;border-radius:99px;background:#eef2f6;color:var(--ink);font-weight:800;border:2px solid transparent}
.wc.on{background:var(--navy);color:var(--gold);border-color:var(--navy)}
.lowli{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-weight:700}
.lowli small{color:var(--mut);display:block;font-weight:400}
.mf{display:flex;gap:8px;margin-top:16px}
.mf .btn{flex:1}
.shake{animation:sk .3s}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:90;display:grid;gap:8px;width:calc(100% - 28px);max-width:420px;pointer-events:none}
.tt{background:var(--navy);color:#fff;padding:12px 16px;border-radius:14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:up .25s;text-align:center}
.tt.err{background:var(--bad)}
.tt.ok{background:var(--ok)}
.tt.warn{background:var(--warn)}
.tt.new{background:var(--gold);color:var(--navy)}
@keyframes fi{from{opacity:0}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>
/* =====================================================================
   إعدادات Firebase (لو فاضية التطبيق بيشتغل تجريبي على الجهاز ده بس)
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCvkTIOjlyTN0_ufZIgktZQYkiBzE0E1fI",
  authDomain: "makhzn-el-gwhra.firebaseapp.com",
  databaseURL: "https://makhzn-el-gwhra-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "makhzn-el-gwhra",
  appId: "1:31337323805:web:f491c6b124588c0d00d5f4"
};
// SHA-256 لباسورد المدير الأول (المدير يقدر يغيّره من جوه التطبيق ⚙)
const MANAGER_HASH = "269807b5580b9100394136dd37e8bb495ab8fbbce46f32c288cb6e53f6b162fe";
// حد التنبيه: لما كمية أي صنف توصل للرقم ده أو أقل
const LOW = 20;
// العمال المبدئيين (أول تشغيل بس) — المدير يعدّلهم من تبويب «العمال»
const DEFAULT_WORKERS = [
  {id:'w_mikel',    name:'مايكل', pin:'1111'},
  {id:'w_youssef',  name:'يوسف',  pin:'2222'},
  {id:'w_mahmoud',  name:'محمود', pin:'3333'}
];

const WH = [
  {id:'tissue', name:'مخزن المناديل', ic:'🧻'},
  {id:'new',    name:'المخزن الجديد', ic:'🏬'},
  {id:'foil',   name:'مخزن الفويل',   ic:'✨'}
];

/* ---------------- helpers ---------------- */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const whName = id=>(WH.find(w=>w.id===id)||{}).name||id;
const norm = s=>String(s||'').toLowerCase().replace(/[ً-ٟـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').trim();
const num = v=>{const n=Math.floor(Number(v));return isFinite(n)&&n>0?n:0;};
const fmtTime = ts=>{try{return new Date(ts).toLocaleString('ar-EG',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});}catch(e){return '';}};
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function getp(o,p){return p.split('/').reduce((a,k)=>a!=null&&a[k]!==undefined?a[k]:undefined,o);}
function setp(o,p,v){
  const ks=p.split('/'); let c=o;
  for(let i=0;i<ks.length-1;i++){ if(typeof c[ks[i]]!=='object'||c[ks[i]]===null) c[ks[i]]={}; c=c[ks[i]]; }
  const last=ks[ks.length-1];
  if(v===null||v===undefined) delete c[last]; else c[last]=v;
}
function toast(msg,kind){
  const el=document.createElement('div'); el.className='tt '+(kind||''); el.textContent=msg;
  $('#toast').appendChild(el); setTimeout(()=>el.remove(),(kind==='new'||kind==='warn')?6000:3200);
}

/* ---------------- storage adapters ---------------- */
const LocalDB=(()=>{
  const K='wh_demo_v2', subs=[];
  const load=()=>{try{return JSON.parse(localStorage.getItem(K))||{};}catch(e){return {};}};
  const emit=()=>{const s=load();subs.forEach(([p,cb])=>cb(getp(s,p)||null));};
  window.addEventListener('storage',e=>{if(e.key===K)emit();});
  return {
    sub(p,cb){subs.push([p,cb]);cb(getp(load(),p)||null);},
    async multi(up){const s=load();Object.keys(up).forEach(p=>setp(s,p,up[p]));localStorage.setItem(K,JSON.stringify(s));emit();},
    key(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
  };
})();
function FbDB(){
  const db=firebase.database();
  return {
    sub(p,cb){db.ref(p).on('value',s=>cb(s.val()),err=>{console.error(err);toast('مشكلة في الاتصال بقاعدة البيانات (راجع القواعد Rules)','err');});},
    multi(up){return db.ref().update(up);},
    key(){return db.ref('log').push().key;}
  };
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load '+src));document.head.appendChild(s);});}

/* ---------------- state ---------------- */
let DB=null;
const S={view:'pick',wh:null,role:null,user:null,tab:'stock',q:'',items:{},reqs:{},workers:{},cfg:{},log:{},cart:{},filter:'pending',lf:'all',demo:false};
let seenPending=null, audioCtx=null, fails=0, lockUntil=0, gotW=false, gotC=false, seedTried=false;
const lastWorker=()=>{try{return localStorage.getItem('wh_lastworker')||'';}catch(e){return '';}};
const saveLastWorker=id=>{try{localStorage.setItem('wh_lastworker',id);}catch(e){}};
const mgrHash=()=>S.cfg.mgrHash||MANAGER_HASH;

/* ---------------- data helpers ---------------- */
function itemsOf(wh){
  return Object.keys(S.items).map(id=>Object.assign({id},S.items[id],{qty:num(S.items[id].qty)}))
    .filter(i=>i.wh===wh).sort((a,b)=>String(a.name).localeCompare(String(b.name),'ar'));
}
function allLow(){
  return Object.keys(S.items).map(id=>Object.assign({id},S.items[id],{qty:num(S.items[id].qty)}))
    .filter(i=>i.qty<=LOW).sort((a,b)=>a.qty-b.qty);
}
function workerList(){return Object.keys(S.workers).map(id=>Object.assign({id},S.workers[id])).sort((a,b)=>String(a.name).localeCompare(String(b.name),'ar'));}
function reqList(){return Object.keys(S.reqs).map(id=>Object.assign({id},S.reqs[id])).sort((a,b)=>(b.ts||0)-(a.ts||0));}
function reqText(r){
  if(r.type==='add'&&r.item) return `طلب إضافة ${r.item.qty} ${r.item.unit||''} من «${r.item.name}»`;
  const ls=(r.lines||[]).map(l=>`${l.qty} ${l.unit||''} ${l.name}`.replace(/\s+/g,' ')).join('، ');
  return `تم سحب: ${ls}`;
}
function myReqs(){return S.user?reqList().filter(r=>r.wid===S.user.id):[];}
function pendingCount(){
  if(S.role==='manager') return reqList().filter(r=>r.status==='pending').length;
  return myReqs().filter(r=>r.status==='pending').length;
}
function cartCount(){return Object.keys(S.cart).filter(id=>S.cart[id]>0&&S.items[id]).length;}
function addUpdates(wh,name,qty,unit){
  const ex=Object.keys(S.items).find(id=>S.items[id].wh===wh&&norm(S.items[id].name)===norm(name));
  const up={};let after=qty;
  if(ex){ after=num(S.items[ex].qty)+qty; up['items/'+ex+'/qty']=after; }
  else { up['items/'+DB.key()]={wh,name:name.trim(),qty,unit:(unit||'').trim()||'قطعة',ts:Date.now()}; }
  return {up,merged:!!ex,after};
}
function logEntry(o){return ['log/'+DB.key(),Object.assign({ts:Date.now()},o)];}
const TYPE_LABEL={withdraw:'سحب',add:'إضافة',edit:'تعديل',delete:'حذف',reject:'رفض'};
function logText(l){
  const u=l.unit?' '+l.unit:'';
  switch(l.type){
    case 'withdraw': return `${l.worker||'عامل'} سحب ${l.qty}${u} من «${l.name}» (الباقي ${l.after})`;
    case 'add': return `إضافة ${l.qty}${u} من «${l.name}» — ${l.worker?'طلب '+l.worker:'بواسطة المدير'}${l.after!=null?' (الرصيد '+l.after+')':''}`;
    case 'edit': return `تعديل «${l.name}»: الكمية ${l.before} ← ${l.qty}`;
    case 'delete': return `حذف «${l.name}» (كان ${l.qty})`;
    case 'reject': return `رفض: ${l.note||''}`;
  }
  return '';
}

/* ---------------- first-run seed of workers ---------------- */
async function trySeed(){
  if(!gotW||!gotC||seedTried)return; seedTried=true;
  if(S.cfg.seeded||Object.keys(S.workers).length)return;
  try{
    const up={'config/seeded':true};
    for(const w of DEFAULT_WORKERS) up['workers/'+w.id]={name:w.name,pin:await sha(w.id+':'+w.pin),ts:Date.now()};
    await DB.multi(up);
  }catch(e){console.error(e);}
}

/* ---------------- notifications for manager ---------------- */
function beep(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);o.type='sine';o.frequency.value=880;
    g.gain.setValueAtTime(.2,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.5);
    o.start();o.stop(audioCtx.currentTime+.5);
  }catch(e){}
}
function sysNotify(title,body){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    if(navigator.serviceWorker&&navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,icon:'icon-192.png',dir:'rtl',lang:'ar'})).catch(()=>{});
    } else new Notification(title,{body});
  }catch(e){}
}
function onReqs(v){
  S.reqs=v||{};
  const pend=Object.keys(S.reqs).filter(k=>S.reqs[k].status==='pending');
  if(seenPending===null){ seenPending=new Set(pend); }
  else{
    const fresh=pend.filter(k=>!seenPending.has(k)); fresh.forEach(k=>seenPending.add(k));
    if(fresh.length&&S.role==='manager'){
      const r=S.reqs[fresh[0]];
      beep(); toast('🔔 '+reqText(r)+' — '+(r.worker||''),'new'); sysNotify('مخازن الجوهرة',reqText(r)+' — '+(r.worker||''));
    }
  }
  render();
}

/* ---------------- modal ---------------- */
function closeModal(){const m=$('#modal');if(m)m.remove();}
function modal(title,body,buttons){
  closeModal();
  const m=document.createElement('div');m.id='modal';m.className='ov';
  m.innerHTML=`<div class="box"><h3>${title}</h3><div class="mb">${body}</div><div class="mf"></div></div>`;
  const mf=$('.mf',m);
  buttons.forEach((b,i)=>{const el=document.createElement('button');el.className='btn '+(b.cls||'');el.textContent=b.t;el.onclick=()=>b.fn(m);el.dataset.i=i;mf.appendChild(el);});
  m.addEventListener('click',e=>{if(e.target===m)closeModal();});
  m.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){const p=m.querySelector('.btn.pri,.btn.ok,.btn.bad');p&&p.click();}});
  document.body.appendChild(m);
  const f=m.querySelector('input');if(f)setTimeout(()=>f.focus(),60);
  return m;
}

/* ---------------- export (CSV opens in Excel) ---------------- */
function download(name,rows){
  const cell=c=>{let s=String(c==null?'':c);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};
  const csv='﻿'+rows.map(r=>r.map(cell).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);
}
const dstamp=()=>new Date().toISOString().slice(0,10);
function exportLog(){
  const list=Object.keys(S.log).map(id=>S.log[id]).sort((a,b)=>(a.ts||0)-(b.ts||0));
  const rows=[['التاريخ','الوقت','النوع','المخزن','الصنف','الكمية','الوحدة','العامل','الرصيد بعد الحركة']];
  list.forEach(l=>{const d=new Date(l.ts||0);rows.push([d.toLocaleDateString('en-GB'),d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),TYPE_LABEL[l.type]||l.type,whName(l.wh),l.name||l.note||'',l.qty==null?'':l.qty,l.unit||'',l.worker||(l.type==='reject'?'':'المدير'),l.after==null?'':l.after]);});
  download('movements-'+dstamp()+'.csv',rows);toast('✔ اتنزل ملف السجل','ok');
}
function exportStock(){
  const rows=[['المخزن','الصنف','الكمية','الوحدة','الحالة']];
  WH.forEach(w=>itemsOf(w.id).forEach(i=>rows.push([w.name,i.name,i.qty,i.unit||'',i.qty===0?'نفد':(i.qty<=LOW?'قليل':'تمام')])));
  download('stock-'+dstamp()+'.csv',rows);toast('✔ اتنزل ملف المخزون','ok');
}

/* ---------------- actions ---------------- */
function setCart(id,v){
  const it=S.items[id];if(!it)return;
  const q=Math.min(num(v),num(it.qty));
  if(q>0)S.cart[id]=q;else delete S.cart[id];
}
async function submitCart(){
  const by={};
  Object.keys(S.cart).forEach(id=>{
    const it=S.items[id];if(!it)return;
    const q=Math.min(num(S.cart[id]),num(it.qty));if(q<=0)return;
    (by[it.wh]=by[it.wh]||[]).push({id,name:it.name,unit:it.unit||'',qty:q});
  });
  const up={};
  Object.keys(by).forEach(wh=>{up['requests/'+DB.key()]={type:'withdraw',wh,worker:S.user.name,wid:S.user.id,lines:by[wh],status:'pending',ts:Date.now()};});
  if(!Object.keys(up).length)return;
  try{await DB.multi(up);S.cart={};toast('✔ اتبعت للمدير للموافقة','ok');render();}
  catch(e){console.error(e);toast('حصلت مشكلة في الإرسال — جرّب تاني','err');}
}

    {t:'حفظ',cls:'pri',fn:async m=>{
      const name=$('#fn',m).value.trim(),unit=$('#fu',m).value.trim()||'قطعة',qv=$('#fq',m).value;
      if(!name){$('#fe',m).textContent='اكتب اسم الصنف';return;}
      const qty=Math.max(0,Math.floor(Number(qv))||0);
      const up={['items/'+id+'/name']:name,['items/'+id+'/qty']:qty,['items/'+id+'/unit']:unit};
      const [k,v]=logEntry({type:'edit',wh:it.wh,name,unit,qty,before:cur.qty,worker:''});up[k]=v;
      try{await DB.multi(up);closeModal();toast('✔ اتحفظ','ok');}
      catch(e){$('#fe',m).textContent='حصلت مشكلة — جرّب تاني';}
    }}
  ]);
}
function delItemModal(id){
  const it=S.items[id];if(!it)return;
  modal('حذف صنف',`<p>متأكد إنك عايز تحذف «${esc(it.name)}» من ${whName(it.wh)}؟</p>`,[
    {t:'لا',fn:closeModal},
    {t:'حذف',cls:'bad',fn:async()=>{
      const up={['items/'+id]:null};const [k,v]=logEntry({type:'delete',wh:it.wh,name:it.name,unit:it.unit||'',qty:num(it.qty),worker:''});up[k]=v;
      try{await DB.multi(up);delete S.cart[id];closeModal();toast('اتحذف','ok');}catch(e){toast('حصلت مشكلة','err');}}}
  ]);
}
async function approve(id){
  const r=S.reqs[id];if(!r||r.status!=='pending')return;
  const up={},warns=[];
  if(r.type==='withdraw'){
    for(const l of (r.lines||[])){
      const it=S.items[l.id];
      if(!it){toast('الصنف «'+l.name+'» اتحذف من المخزن','err');return;}
      const cur=num(it.qty),q=num(l.qty);
      if(cur<q){toast('الكمية مش كفاية في «'+l.name+'» (المتاح '+cur+')','err');return;}
      const left=cur-q;
      up['items/'+l.id+'/qty']=left;
      const [k,v]=logEntry({type:'withdraw',wh:r.wh,name:l.name,unit:l.unit||'',qty:q,after:left,worker:r.worker||''});up[k]=v;
      if(left<=LOW)warns.push('«'+l.name+'» باقي '+left);
    }
  }else if(r.type==='add'&&r.item){
    const a=addUpdates(r.wh,r.item.name,num(r.item.qty),r.item.unit);Object.assign(up,a.up);
    const [k,v]=logEntry({type:'add',wh:r.wh,name:r.item.name,unit:r.item.unit||'',qty:num(r.item.qty),after:a.after,worker:r.worker||''});up[k]=v;
  }
  up['requests/'+id+'/status']='approved';up['requests/'+id+'/resolvedAt']=Date.now();
  try{
    await DB.multi(up);toast('✔ تمت الموافقة'+(r.type==='withdraw'?' واتخصمت الكمية':' واتضاف الصنف'),'ok');
    if(warns.length)setTimeout(()=>toast('⚠️ قرب يخلص: '+warns.join('، '),'warn'),300);
  }catch(e){console.error(e);toast('حصلت مشكلة — جرّب تاني','err');}
}
async function reject(id){
  const r=S.reqs[id];if(!r||r.status!=='pending')return;
  const up={['requests/'+id+'/status']:'rejected',['requests/'+id+'/resolvedAt']:Date.now()};
  const [k,v]=logEntry({type:'reject',wh:r.wh,worker:r.worker||'',note:reqText(r)+' — '+(r.worker||'')});up[k]=v;
  try{await DB.multi(up);toast('اتسجّل كمرفوض — مفيش خصم','ok');}
  catch(e){toast('حصلت مشكلة — جرّب تاني','err');}
}
function lowsModal(){
  const l=allLow();
  modal('⚠️ أصناف قاربت على النفاد',`<p style="margin-bottom:6px;color:var(--mut)">الكمية ${LOW} أو أقل:</p>`+(l.length?l.map(i=>`<div class="lowli"><span>${esc(i.name)}<small>${whName(i.wh)}</small></span><span style="color:${i.qty?'var(--warn)':'var(--bad)'}">${i.qty?i.qty+' '+esc(i.unit||''):'نفد'}</span></div>`).join(''):'<p>مفيش</p>'),[{t:'تمام',cls:'pri',fn:closeModal}]);
}
function settingsModal(){
  const m=modal('⚙ تغيير باسورد المدير',`<label>الباسورد الحالي</label><input id="p0" type="password" autocomplete="off"><label>الباسورد الجديد (4 حروف/أرقام أو أكتر)</label><input id="p1" type="password" autocomplete="off"><label>أعد كتابة الجديد</label><input id="p2" type="password" autocomplete="off"><div class="err" id="pe"></div>`,[
    {t:'إلغاء',fn:closeModal},
    {t:'حفظ',cls:'pri',fn:async()=>{
      const err=$('#pe',m),a=$('#p0',m).value,b=$('#p1',m).value,c=$('#p2',m).value;
      if(await sha(a)!==mgrHash()){err.textContent='الباسورد الحالي غلط';return;}
      if(b.length<4){err.textContent='الجديد لازم 4 على الأقل';return;}
      if(b!==c){err.textContent='التكرار مش زي الجديد';return;}
      try{await DB.multi({'config/mgrHash':await sha(b)});closeModal();toast('✔ اتغيّر الباسورد — استخدم الجديد المرة الجاية','ok');}
      catch(e){err.textContent='حصلت مشكلة — جرّب تاني';}
    }}
  ]);
}
function workerModal(id){
  const w=id?S.workers[id]:null;
  const m=modal(w?'تعديل عامل':'إضافة عامل',`<label>الاسم</label><input id="wn" value="${esc(w?w.name:'')}" autocomplete="off"><label>${w?'رقم سري جديد (سيبه فاضي لو مش عايز تغيّره)':'الرقم السري (4 أرقام أو أكتر)'}</label><input id="wpn" inputmode="numeric" autocomplete="off"><div class="err" id="we"></div>`,[
    {t:'إلغاء',fn:closeModal},
    {t:'حفظ',cls:'pri',fn:async()=>{
      const err=$('#we',m),name=$('#wn',m).value.trim(),pin=$('#wpn',m).value.trim();
      if(!name){err.textContent='اكتب الاسم';return;}
      if(workerList().some(x=>x.id!==id&&norm(x.name)===norm(name))){err.textContent='فيه عامل بنفس الاسم';return;}
      if((!w||pin)&&pin.length<4){err.textContent='الرقم السري 4 على الأقل';return;}
      const wid=id||'w_'+DB.key();
      try{
        if(w){const up={['workers/'+id+'/name']:name};if(pin)up['workers/'+id+'/pin']=await sha(id+':'+pin);await DB.multi(up);}
        else await DB.multi({['workers/'+wid]:{name,pin:await sha(wid+':'+pin),ts:Date.now()}});
        closeModal();toast('✔ اتحفظ','ok');
      }catch(e){console.error(e);err.textContent='حصلت مشكلة — جرّب تاني';}
    }}
  ]);
}
function delWorkerModal(id){
  const w=S.workers[id];if(!w)return;
  modal('حذف عامل',`<p>متأكد إنك عايز تحذف «${esc(w.name)}»؟ مش هيقدر يدخل تاني. الطلبات القديمة بتاعته هتفضل في السجل.</p>`,[
    {t:'لا',fn:closeModal},
    {t:'حذف',cls:'bad',fn:async()=>{try{await DB.multi({['workers/'+id]:null});closeModal();toast('اتحذف','ok');}catch(e){toast('حصلت مشكلة','err');}}}
  ]);
}

const ACT={
  pickwh(d){S.wh=d.id;showRole();},
  toPick(){showPick();},
  role(d){ if(d.r==='worker')askWorker();else askPassword(); },
  sw(d){S.wh=d.id;S.q='';const q=$('#q');if(q)q.value='';render();},
  tab(d){S.tab=d.t;render();},
  filter(d){S.filter=d.f;renderList();},
  lf(d){S.lf=d.f;renderList();},
  inc(d){setCart(d.id,num(S.cart[d.id])+1);renderList();},
  dec(d){setCart(d.id,num(S.cart[d.id])-1);renderList();},
  clear(){S.cart={};renderList();},
  confirm(){confirmCart();},
  add(){addItemModal();},
  edit(d){editItemModal(d.id);},
  del(d){delItemModal(d.id);},
  approve(d){approve(d.id);},
  reject(d){reject(d.id);},
  lows(){lowsModal();},
  settings(){settingsModal();},
  addw(){workerModal(null);},
  editw(d){workerModal(d.id);},
  delw(d){delWorkerModal(d.id);},
  expLog(){exportLog();},
  expStock(){exportStock();},
  exit(){S.cart={};showPick();}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t||t.disabled)return;
  const f=ACT[t.dataset.act];if(f)f(t.dataset,t);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches&&t.matches('.step input')){
    // تحديث في المكان من غير إعادة بناء القائمة، عشان زرار OK اللي العامل بيدوس عليه ميتبدلش
    setCart(t.dataset.id,t.value);
    const it=S.items[t.dataset.id],c=Math.min(num(S.cart[t.dataset.id]),num(it&&it.qty)),row=t.closest('.row');
    t.value=c;row.classList.toggle('sel',c>0);
    const [dec,inc]=row.querySelectorAll('.step button');dec.disabled=!c;inc.disabled=c>=num(it&&it.qty);
    patchBar();
  }
});

/* ---------------- boot ---------------- */
async function boot(){
  const c=FIREBASE_CONFIG;let demo=!(c.apiKey&&c.databaseURL);
  if(!demo){
    try{
      await loadScript('https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js');
      firebase.initializeApp(c);DB=FbDB();
    }catch(e){console.error(e);demo=true;toast('مفيش نت أو إعدادات Firebase غلط — شغال تجريبي','err');}
  }
  if(demo)DB=LocalDB;
  S.demo=demo;
  showPick();
  DB.sub('items',v=>{S.items=v||{};render();});
  DB.sub('requests',onReqs);
  DB.sub('log',v=>{S.log=v||{};if(S.tab==='log')render();});
  DB.sub('config',v=>{S.cfg=v||{};gotC=true;trySeed();});
  DB.sub('workers',v=>{
    S.workers=v||{};gotW=true;trySeed();
    if(S.role==='worker'&&S.user&&!S.workers[S.user.id]&&gotW){toast('اتحذف حسابك — ادخل تاني','err');showPick();return;}
    render();
  });
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
}
boot();
</script>
