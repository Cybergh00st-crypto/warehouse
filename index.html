<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f2a43">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مخازن الجوهرة">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>مخازن الجوهرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0f2a43; --navy2:#173a5c; --teal:#0e7c86; --gold:#c9a227; --gold2:#f4e6b0;
  --bg:#f3f5f8; --card:#fff; --ink:#142235; --mut:#6b7a8c; --line:#e3e8ee;
  --ok:#1c9c5b; --okbg:#e5f6ed; --bad:#d6453d; --badbg:#fdeceb; --warn:#b7791f; --warnbg:#fff4dc;
  --r:18px; --sh:0 3px 12px rgba(15,42,67,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;width:100%;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif}
button,input,select{font-family:inherit;font-size:1rem}
button{cursor:pointer;border:0}
#app{min-height:100dvh;width:100%;max-width:600px;margin:0 auto;background:var(--bg)}
.demo{background:var(--warnbg);color:var(--warn);font-size:14px;padding:8px 14px;text-align:center;font-weight:700}

/* ---------- pick / role screens ---------- */
.hero{background:linear-gradient(160deg,var(--navy),var(--navy2));color:#fff;padding:42px 20px 64px;text-align:center;border-radius:0 0 32px 32px}
.logo{width:76px;height:76px;margin:0 auto 12px;border-radius:22px;background:var(--gold);display:grid;place-items:center;font-size:38px;box-shadow:0 8px 22px rgba(0,0,0,.25)}
.hero h1{margin:0;font-size:28px;font-weight:800}
.hero p{margin:6px 0 0;opacity:.85;font-size:16px}
.pickwrap{padding:0 16px;margin-top:-38px}
.pcard{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border-radius:var(--r);padding:18px 16px;margin-bottom:14px;box-shadow:var(--sh);text-align:right;color:var(--ink);border:2px solid transparent;transition:.15s}
.pcard:active{transform:scale(.98)}
.pcard:hover{border-color:var(--gold)}
.pnum{width:48px;height:48px;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.pcard b{font-size:20px;display:block}
.pcard small{color:var(--mut);font-size:14px}
.pcard .ar{margin-right:auto;color:var(--gold);font-size:26px;font-weight:800}
.back{background:none;color:#fff;font-size:16px;font-weight:700;opacity:.95;padding:6px 0;margin-bottom:8px;display:block;text-align:right}
.rolebox{padding:0 16px;margin-top:-38px;display:grid;gap:14px}
.rcard{background:var(--card);border-radius:var(--r);padding:26px 18px;box-shadow:var(--sh);text-align:center;color:var(--ink);border:2px solid transparent;transition:.15s}
.rcard:active{transform:scale(.98)}
.rcard:hover{border-color:var(--gold)}
.rcard .ic{font-size:44px}
.rcard b{display:block;font-size:22px;margin-top:6px}
.rcard small{color:var(--mut);font-size:15px}

/* ---------- main ---------- */
.top{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top .brand{font-weight:800;font-size:19px;flex:1;display:flex;align-items:center;gap:8px;white-space:nowrap}
.top .brand i{font-style:normal;background:var(--gold);color:var(--navy);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:none}
.pill{font-size:13px;font-weight:800;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.15);white-space:nowrap}
.pill.mgr{background:var(--gold);color:var(--navy)}
.ibtn{position:relative;background:rgba(255,255,255,.14);color:#fff;width:42px;height:42px;border-radius:12px;font-size:20px;display:grid;place-items:center;flex:none}
.badge{position:absolute;top:-5px;left:-5px;min-width:22px;height:22px;border-radius:11px;background:var(--bad);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid var(--navy)}
.chips{display:flex;gap:8px;padding:12px 14px 6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:1;text-align:center;background:var(--card);color:var(--ink);border-radius:99px;padding:11px 10px;font-weight:800;font-size:14px;box-shadow:var(--sh);border:2px solid transparent;white-space:nowrap}
.chip.on{background:var(--navy);color:var(--gold);border-color:var(--navy)}
.tools{display:flex;gap:8px;padding:8px 14px}
.sbox{flex:1;position:relative}
.sbox input{width:100%;padding:13px 40px 13px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;outline:0;font-size:15px}
.sbox input:focus{border-color:var(--teal)}
.sbox span{position:absolute;right:13px;top:50%;transform:translateY(-50%);opacity:.55;font-size:17px}
.addb{background:var(--gold);color:var(--navy);font-weight:800;border-radius:14px;padding:0 16px;font-size:15px;white-space:nowrap;box-shadow:var(--sh)}
.meta{padding:4px 16px 8px;color:var(--mut);font-size:13px;font-weight:600}
#content{padding:0 14px 180px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--sh);border:2px solid transparent}
.row.sel{border-color:var(--teal);background:#f1fafb}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-size:17px;line-height:1.35;word-break:break-word}
.row .nm small{color:var(--mut);font-size:13px}
.av{text-align:center;min-width:54px;padding:0 4px}
.av small{display:block;color:var(--mut);font-size:11px}
.av b{font-size:19px}
.av.zero b{color:var(--bad)}
.step{display:flex;align-items:center;gap:5px;flex:none}
.step button{width:40px;height:40px;border-radius:12px;background:var(--navy);color:#fff;font-size:22px;font-weight:700;line-height:1;display:grid;place-items:center}
.step button:disabled{opacity:.25}
.step input{width:54px;height:40px;text-align:center;padding:4px 2px;border-radius:12px;border:1.5px solid var(--line);font-weight:800;font-size:16px}
.act{display:flex;gap:8px;flex:none}
.act button{width:42px;height:42px;border-radius:12px;background:#eef2f6;font-size:18px;display:grid;place-items:center}
.act .del{background:var(--badbg)}
.empty{text-align:center;color:var(--mut);padding:54px 20px}
.empty .big{font-size:48px;margin-bottom:8px}
.empty p{font-size:17px;font-weight:700;margin:0 0 4px;color:var(--ink)}
.bar{position:fixed;bottom:68px;left:0;right:0;max-width:600px;margin:0 auto;padding:10px 14px;background:linear-gradient(transparent,var(--bg) 35%);display:flex;gap:8px;z-index:15}
.bar .ok{flex:1;background:var(--ok);color:#fff;font-weight:800;font-size:17px;padding:15px;border-radius:14px;box-shadow:0 6px 18px rgba(28,156,91,.35)}
.bar .clr{background:#fff;color:var(--bad);font-weight:800;padding:0 18px;border-radius:14px;box-shadow:var(--sh);font-size:15px}
.tabs{position:fixed;bottom:0;left:0;right:0;max-width:600px;margin:0 auto;background:#fff;display:flex;border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 10px rgba(0,0,0,.05)}
.tabs button{flex:1;background:none;padding:10px 4px 8px;color:var(--mut);font-weight:800;font-size:14px;position:relative}
.tabs button .t{font-size:22px;display:block;margin-bottom:2px}
.tabs button.on{color:var(--navy)}
.tabs button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3.5px;background:var(--gold);border-radius:0 0 4px 4px}
.tabs .badge{top:5px;left:calc(50% - 32px);border-color:#fff}

/* requests */
.fl{display:flex;gap:6px;padding:10px 0}
.fl button{flex:1;background:#fff;border-radius:12px;padding:11px 4px;font-weight:800;font-size:13px;color:var(--mut);box-shadow:var(--sh)}
.fl button.on{background:var(--navy);color:var(--gold)}
.rq{background:var(--card);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:var(--sh);border-right:5px solid var(--warn)}
.rq.approved{border-right-color:var(--ok)}
.rq.rejected{border-right-color:var(--bad)}
.rq .h{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mut);margin-bottom:6px;font-weight:600}
.rq .tx{font-weight:800;font-size:16px;line-height:1.65}
.rq .by{font-size:14px;color:var(--mut);margin-top:6px;font-weight:600}
.rq .st{display:inline-block;margin-top:10px;padding:4px 14px;border-radius:99px;font-size:13px;font-weight:800}
.st.pending{background:var(--warnbg);color:var(--warn)}
.st.approved{background:var(--okbg);color:var(--ok)}
.st.rejected{background:var(--badbg);color:var(--bad)}
.rq .bt{display:flex;gap:10px;margin-top:12px}
.btn{padding:13px 16px;border-radius:12px;font-weight:800;background:#e8edf2;color:var(--ink);font-size:15px}
.btn.pri{background:var(--navy);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn.fl1{flex:1}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(10,20,35,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fi .15s}
@media(min-width:600px){.ov{align-items:center}}
.box{background:#fff;width:100%;max-width:460px;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:up .2s}
@media(min-width:600px){.box{border-radius:22px;padding:22px}}
.box h3{margin:0 0 14px;font-size:21px}
.mb label{display:block;font-size:14px;color:var(--mut);margin:12px 0 5px;font-weight:700}
.mb input{width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--line);outline:0;font-size:16px}
.mb input:focus{border-color:var(--teal)}
.mb .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mb p{margin:0;line-height:1.7;font-size:16px}
.mb .err{color:var(--bad);font-weight:700;font-size:14px;margin-top:8px;min-height:20px}
.mf{display:flex;gap:10px;margin-top:18px}
.mf .btn{flex:1}
.shake{animation:sk .3s}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:90;display:grid;gap:8px;width:calc(100% - 28px);max-width:440px;pointer-events:none}
.tt{background:var(--navy);color:#fff;padding:14px 16px;border-radius:14px;font-weight:700;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:up .25s;text-align:center}
.tt.err{background:var(--bad)}
.tt.ok{background:var(--ok)}
.tt.new{background:var(--gold);color:var(--navy)}
@keyframes fi{from{opacity:0}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCvkTIOjlyTN0_ufZIgktZQYkiBzE0E1fI",
  authDomain: "makhzn-el-gwhra.firebaseapp.com",
  databaseURL: "https://makhzn-el-gwhra-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "makhzn-el-gwhra",
  appId: "1:31337323805:web:f491c6b124588c0d00d5f4"
};
const MANAGER_HASH = "269807b5580b9100394136dd37e8bb495ab8fbbce46f32c288cb6e53f6b162fe";

const WH = [
  {id:'tissue', name:'مخزن المناديل', ic:'🧻'},
  {id:'new',    name:'المخزن الجديد', ic:'🏬'},
  {id:'foil',   name:'مخزن الفويل',   ic:'✨'}
];

const $ = (s,r=document)=>r.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const whName = id=>(WH.find(w=>w.id===id)||{}).name||id;
const norm = s=>String(s||'').toLowerCase().replace(/[ً-ٟـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').trim();
const num = v=>{const n=Math.floor(Number(v));return isFinite(n)&&n>0?n:0;};
const fmtTime = ts=>{try{return new Date(ts).toLocaleString('ar-EG',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});}catch(e){return '';}};
function getp(o,p){return p.split('/').reduce((a,k)=>a!=null&&a[k]!==undefined?a[k]:undefined,o);}
function setp(o,p,v){
  const ks=p.split('/'); let c=o;
  for(let i=0;i<ks.length-1;i++){ if(typeof c[ks[i]]!=='object'||c[ks[i]]===null) c[ks[i]]={}; c=c[ks[i]]; }
  const last=ks[ks.length-1];
  if(v===null||v===undefined) delete c[last]; else c[last]=v;
}
function toast(msg,kind){
  const el=document.createElement('div'); el.className='tt '+(kind||''); el.textContent=msg;
  $('#toast').appendChild(el); setTimeout(()=>el.remove(),kind==='new'?6000:3200);
}

const LocalDB=(()=>{
  const K='wh_demo_v1', subs=[];
  const load=()=>{try{return JSON.parse(localStorage.getItem(K))||{};}catch(e){return {};}};
  const emit=()=>{const s=load();subs.forEach(([p,cb])=>cb(getp(s,p)||null));};
  window.addEventListener('storage',e=>{if(e.key===K)emit();});
  return {
    sub(p,cb){subs.push([p,cb]);cb(getp(load(),p)||null);},
    async multi(up){const s=load();Object.keys(up).forEach(p=>setp(s,p,up[p]));localStorage.setItem(K,JSON.stringify(s));emit();},
    key(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
  };
})();
function FbDB(){
  const db=firebase.database();
  return {
    sub(p,cb){db.ref(p).on('value',s=>cb(s.val()),err=>{console.error(err);toast('مشكلة في الاتصال بقاعدة البيانات','err');});},
    multi(up){return db.ref().update(up);},
    key(){return db.ref('requests').push().key;}
  };
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load '+src));document.head.appendChild(s);});}

let DB=null;
const S={view:'pick',wh:null,role:null,tab:'stock',q:'',items:{},reqs:{},cart:{},filter:'pending',demo:false};
let seenPending=null, audioCtx=null, fails=0, lockUntil=0;
const savedName=()=>{try{return localStorage.getItem('wh_worker')||'';}catch(e){return '';}};
const saveName=n=>{try{localStorage.setItem('wh_worker',n);}catch(e){}};

function itemsOf(wh){
  return Object.keys(S.items).map(id=>Object.assign({id},S.items[id],{qty:num(S.items[id].qty)}))
    .filter(i=>i.wh===wh).sort((a,b)=>String(a.name).localeCompare(String(b.name),'ar'));
}
function reqList(){return Object.keys(S.reqs).map(id=>Object.assign({id},S.reqs[id])).sort((a,b)=>(b.ts||0)-(a.ts||0));}
function reqText(r){
  if(r.type==='add'&&r.item) return `طلب إضافة ${r.item.qty} ${r.item.unit||''} من «${r.item.name}»`;
  const ls=(r.lines||[]).map(l=>`${l.qty} ${l.unit||''} ${l.name}`.replace(/\s+/g,' ')).join('، ');
  return `تم سحب: ${ls}`;
}
function myReqs(){const n=norm(savedName());return n?reqList().filter(r=>norm(r.worker)===n):[];}
function pendingCount(){
  if(S.role==='manager') return reqList().filter(r=>r.status==='pending').length;
  return myReqs().filter(r=>r.status==='pending').length;
}
function cartCount(){return Object.keys(S.cart).filter(id=>S.cart[id]>0&&S.items[id]).length;}
function addUpdates(wh,name,qty,unit){
  const ex=Object.keys(S.items).find(id=>S.items[id].wh===wh&&norm(S.items[id].name)===norm(name));
  const up={};
  if(ex){ up['items/'+ex+'/qty']=num(S.items[ex].qty)+qty; }
  else { up['items/'+DB.key()]={wh,name:name.trim(),qty,unit:(unit||'').trim()||'قطعة',ts:Date.now()}; }
  return {up,merged:!!ex};
}

function beep(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);o.type='sine';o.frequency.value=880;
    g.gain.setValueAtTime(.2,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.5);
    o.start();o.stop(audioCtx.currentTime+.5);
  }catch(e){}
}
function sysNotify(title,body){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    if(navigator.serviceWorker&&navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,icon:'icon-192.png',dir:'rtl',lang:'ar'})).catch(()=>{});
    } else new Notification(title,{body});
  }catch(e){}
}
function onReqs(v){
  S.reqs=v||{};
  const pend=Object.keys(S.reqs).filter(k=>S.reqs[k].status==='pending');
  if(seenPending===null){ seenPending=new Set(pend); }
  else{
    const fresh=pend.filter(k=>!seenPending.has(k)); fresh.forEach(k=>seenPending.add(k));
    if(fresh.length&&S.role==='manager'){
      const r=S.reqs[fresh[0]];
      beep(); toast('🔔 '+reqText(r)+' — '+(r.worker||''),'new'); sysNotify('مخازن الجوهرة',reqText(r)+' — '+(r.worker||''));
    }
  }
  render();
}

function closeModal(){const m=$('#modal');if(m)m.remove();}
function modal(title,body,buttons){
  closeModal();
  const m=document.createElement('div');m.id='modal';m.className='ov';
  m.innerHTML=`<div class="box"><h3>${title}</h3><div class="mb">${body}</div><div class="mf"></div></div>`;
  const mf=$('.mf',m);
  buttons.forEach((b,i)=>{const el=document.createElement('button');el.className='btn '+(b.cls||'');el.textContent=b.t;el.onclick=()=>b.fn(m);el.dataset.i=i;mf.appendChild(el);});
  m.addEventListener('click',e=>{if(e.target===m)closeModal();});
  m.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){const p=m.querySelector('.btn.pri,.btn.ok,.btn.bad');p&&p.click();}});
  document.body.appendChild(m);
  const f=m.querySelector('input');if(f)setTimeout(()=>f.focus(),60);
  return m;
}

const app=$('#app');
function demoBanner(){return S.demo?'<div class="demo">⚠️ وضع تجريبي — البيانات على الجهاز ده بس (اربط Firebase عشان يشتغل على كل الأجهزة)</div>':'';}

function showPick(){
  S.view='pick';S.role=null;S.wh=null;S.tab='stock';S.q='';
  app.innerHTML=`${demoBanner()}
  <div class="hero"><div class="logo">💎</div><h1>مخازن الجوهرة</h1><p>اختار المخزن علشان تبدأ</p></div>
  <div class="pickwrap">${WH.map((w,i)=>`
    <button class="pcard" data-act="pickwh" data-id="${w.id}">
      <span class="pnum">${i+1}</span><span><b>${w.name}</b><small>${w.ic} دوس للدخول</small></span><span class="ar">‹</span>
    </button>`).join('')}</div>`;
}
function showRole(){
  S.view='role';
  app.innerHTML=`${demoBanner()}
  <div class="hero"><button class="back" data-act="toPick">› رجوع</button><div class="logo">${WH.find(w=>w.id===S.wh).ic}</div><h1>${whName(S.wh)}</h1><p>انت داخل بصفة إيه؟</p></div>
  <div class="rolebox">
    <button class="rcard" data-act="role" data-r="worker"><div class="ic">👷</div><b>عامل</b><small>سجّل اللي سحبته من المخزن</small></button>
    <button class="rcard" data-act="role" data-r="manager"><div class="ic">🛡️</div><b>مدير</b><small>موافقات وإدارة الأصناف (بباسورد)</small></button>
  </div>`;
}
function askPassword(){
  const m=modal('🔒 دخول المدير',`<label>اكتب الباسورد</label><input id="pw" type="password" inputmode="numeric" autocomplete="off"><div class="err" id="pe"></div>`,[
    {t:'إلغاء',fn:closeModal},
    {t:'دخول',cls:'pri',fn:async ()=>{
      const err=$('#pe',m),box=$('.box',m);
      if(Date.now()<lockUntil){err.textContent='محاولات كتير غلط — استنى '+Math.ceil((lockUntil-Date.now())/1000)+' ثانية';return;}
      let h='';
      try{ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode($('#pw',m).value)); h=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
      catch(e){err.textContent='افتح التطبيق من اللينك (https) عشان الباسورد يشتغل';return;}
      if(h===MANAGER_HASH){
        fails=0;S.role='manager';closeModal();
        try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();}catch(e){}
        try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
        enterMain();
      }else{
        fails++; if(fails>=5){lockUntil=Date.now()+30000;fails=0;}
        err.textContent='الباسورد غلط';box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');$('#pw',m).select();
      }
    }}
  ]);
}
function enterMain(){
  S.view='main';S.tab='stock';S.q='';
  app.innerHTML=`${demoBanner()}
  <div class="top" id="hdr"></div>
  <div class="chips" id="chips"></div>
  <div id="tools" class="tools"><div class="sbox"><span>🔍</span><input id="q" type="search" placeholder="ابحث عن صنف..." autocomplete="off"></div><button class="addb" data-act="add" id="addb"></button></div>
  <div class="meta" id="meta"></div>
  <div id="content"></div>
  <div class="bar" id="bar"></div>
  <nav class="tabs" id="tabs"></nav>`;
  $('#q').addEventListener('input',e=>{S.q=e.target.value;renderList();});
  render();
}
function render(){ if(S.view==='main') renderMain(); }
function renderMain(){
  const mgr=S.role==='manager',pc=pendingCount();
  $('#hdr').innerHTML=`<div class="brand"><i>💎</i>مخازن الجوهرة</div>
    <span class="pill ${mgr?'mgr':''}">${mgr?'🛡️ مدير':'👷 عامل'}</span>
    ${mgr?`<button class="ibtn" data-act="tab" data-t="reqs" title="الإشعارات">🔔${pc?`<span class="badge">${pc}</span>`:''}</button>`:''}
    <button class="ibtn" data-act="exit" title="خروج">⏻</button>`;
  $('#chips').innerHTML=WH.map(w=>`<button class="chip ${w.id===S.wh?'on':''}" data-act="sw" data-id="${w.id}">${w.ic} ${w.name}</button>`).join('');
  $('#addb').textContent=mgr?'＋ إضافة صنف':'＋ طلب إضافة';
  $('#tabs').innerHTML=`
    <button class="${S.tab==='stock'?'on':''}" data-act="tab" data-t="stock"><span class="t">📦</span>المخزن</button>
    <button class="${S.tab==='reqs'?'on':''}" data-act="tab" data-t="reqs"><span class="t">${mgr?'📋':'🧾'}</span>${mgr?'الطلبات':'طلباتي'}${pc?`<span class="badge">${pc}</span>`:''}</button>`;
  $('#tools').style.display=S.tab==='stock'?'flex':'none';
  renderList();
}
function renderList(){
  if(S.view!=='main')return;
  if(S.tab==='reqs'){ $('#meta').textContent='';$('#bar').innerHTML='';renderReqs();return; }
  const mgr=S.role==='manager';
  const all=itemsOf(S.wh), q=norm(S.q);
  const list=q?all.filter(i=>norm(i.name).includes(q)):all;
  $('#meta').textContent=all.length?`${whName(S.wh)} • ${all.length} صنف${q?` • نتيجة البحث: ${list.length}`:''}`:'';
  if(!list.length){
    $('#content').innerHTML=`<div class="empty"><div class="big">${q?'🔎':'📭'}</div><p>${q?'مفيش صنف بالاسم ده':'المخزن فاضي لحد دلوقتي'}</p>${!q?`<small>${mgr?'دوس «إضافة صنف» وابدأ':'تقدر تبعت طلب إضافة للمدير'}</small>`:''}</div>`;
  }else{
    $('#content').innerHTML=list.map(i=>{
      const c=Math.min(num(S.cart[i.id]),i.qty);
      if(mgr) return `<div class="row"><div class="nm"><b>${esc(i.name)}</b><small>${esc(i.unit||'')}</small></div>
        <div class="av ${i.qty?'':'zero'}"><small>الكمية</small><b>${i.qty}</b></div>
        <div class="act"><button data-act="edit" data-id="${i.id}" title="تعديل">✎</button><button class="del" data-act="del" data-id="${i.id}" title="حذف">🗑</button></div></div>`;
      return `<div class="row ${c?'sel':''}"><div class="nm"><b>${esc(i.name)}</b><small>${esc(i.unit||'')}</small></div>
        <div class="av ${i.qty?'':'zero'}"><small>${i.qty?'متاح':'نفد'}</small><b>${i.qty}</b></div>
        <div class="step"><button data-act="dec" data-id="${i.id}" ${c?'':'disabled'}>−</button>
        <input type="number" inputmode="numeric" min="0" max="${i.qty}" value="${c}" data-id="${i.id}" ${i.qty?'':'disabled'}>
        <button data-act="inc" data-id="${i.id}" ${c<i.qty?'':'disabled'}>+</button></div></div>`;
    }).join('');
  }
  renderBar();
}
function patchBar(){
  const n=cartCount(),bar=$('#bar'),ok=bar.querySelector('.ok');
  if(n&&ok){ok.textContent=`OK — تأكيد السحب (${n} صنف)`;bar.style.display='flex';}
  else renderBar();
}
function renderBar(){
  const n=cartCount();
  $('#bar').style.display=(S.role==='worker'&&S.tab==='stock'&&n)?'flex':'none';
  $('#bar').innerHTML=n?`<button class="clr" data-act="clear">مسح</button><button class="ok" data-act="confirm">OK — تأكيد السحب (${n} صنف)</button>`:'';
}
function renderReqs(){
  const mgr=S.role==='manager';
  const base=mgr?reqList():myReqs();
  const cnt=s=>base.filter(r=>r.status===s).length;
  const list=base.filter(r=>r.status===S.filter);
  const fl=`<div class="fl">${[['pending','معلّق'],['approved','تمت الموافقة'],['rejected','مرفوض']].map(([k,l])=>`<button class="${S.filter===k?'on':''}" data-act="filter" data-f="${k}">${l} (${cnt(k)})</button>`).join('')}</div>`;
  let body='';
  if(!list.length){
    body=`<div class="empty"><div class="big">${S.filter==='pending'?'✅':'🗂️'}</div><p>${!mgr&&!savedName()?'لسه مبعتّش أي طلب من الجهاز ده':'مفيش طلبات هنا'}</p></div>`;
  }else{
    body=list.map(r=>`<div class="rq ${r.status}">
      <div class="h"><span>${whName(r.wh)}</span><span>${fmtTime(r.ts)}</span></div>
      <div class="tx">${r.type==='add'?'➕ ':'📤 '}${esc(reqText(r))}</div>
      <div class="by">👤 ${esc(r.worker||'')}</div>
      <span class="st ${r.status}">${{pending:'في انتظار المدير',approved:'تمت الموافقة',rejected:'مرفوض'}[r.status]||''}</span>
      ${mgr&&r.status==='pending'?`<div class="bt"><button class="btn ok fl1" data-act="approve" data-id="${r.id}">✔ موافقة</button><button class="btn bad fl1" data-act="reject" data-id="${r.id}">✖ غلط / رفض</button></div>`:''}
    </div>`).join('');
  }
  $('#content').innerHTML=fl+body;
}

function setCart(id,v){
  const it=S.items[id];if(!it)return;
  const q=Math.min(num(v),num(it.qty));
  if(q>0)S.cart[id]=q;else delete S.cart[id];
}
function askWorkerName(){
  modal('اكتب اسمك',`<label>الاسم (لازم) — هيتبعت للمدير مع الطلب</label><input id="wn" value="${esc(savedName())}" autocomplete="off" placeholder="مثال: أحمد">`,[
    {t:'إلغاء',fn:closeModal},
    {t:'تأكيد وإرسال',cls:'ok',fn:async m=>{
      const name=$('#wn',m).value.trim();
      if(!name){$('#wn',m).style.borderColor='var(--bad)';$('#wn',m).focus();return;}
      saveName(name);closeModal();await submitCart(name);
    }}
  ]);
}
async function submitCart(name){
  const by={};
  Object.keys(S.cart).forEach(id=>{
    const it=S.items[id];if(!it)return;
    const q=Math.min(num(S.cart[id]),num(it.qty));if(q<=0)return;
    (by[it.wh]=by[it.wh]||[]).push({id,name:it.name,unit:it.unit||'',qty:q});
  });
  const up={};
  Object.keys(by).forEach(wh=>{up['requests/'+DB.key()]={type:'withdraw',wh,worker:name,lines:by[wh],status:'pending',ts:Date.now()};});
  if(!Object.keys(up).length)return;
  try{await DB.multi(up);S.cart={};toast('✔ اتبعت للمدير للموافقة','ok');render();}
  catch(e){console.error(e);toast('حصلت مشكلة في الإرسال — جرّب تاني','err');}
}
function itemForm(it){
  return `<label>اسم الصنف</label><input id="fn" value="${esc(it?it.name:'')}" autocomplete="off">
  <div class="two"><div><label>الكمية</label><input id="fq" type="number" inputmode="numeric" min="0" value="${it?it.qty:''}"></div>
  <div><label>الوحدة</label><input id="fu" list="units" value="${esc(it?it.unit:'')}" placeholder="كرتونة"></div></div>
  <datalist id="units"><option>كرتونة</option><option>رول</option><option>علبة</option><option>كيس</option><option>قطعة</option><option>كيلو</option><option>باكو</option></datalist>`;
}
function addItemModal(){
  const mgr=S.role==='manager';
  modal(mgr?'إضافة صنف — '+whName(S.wh):'طلب إضافة صنف',
    itemForm(null)+(mgr?'':`<label>اسمك (لازم)</label><input id="fw" value="${esc(savedName())}" autocomplete="off">`)+
    (mgr?'':'<p style="margin-top:10px;color:var(--mut);font-size:13px">الطلب هيروح للمدير ولازم يوافق عليه.</p>')+'<div class="err" id="fe"></div>',[
    {t:'إلغاء',fn:closeModal},
    {t:mgr?'إضافة':'إرسال للمدير',cls:'pri',fn:async m=>{
      const name=$('#fn',m).value.trim(),qty=num($('#fq',m).value),unit=$('#fu',m).value.trim();
      const err=$('#fe',m);
      if(!name){err.textContent='اكتب اسم الصنف';return;}
      if(qty<=0){err.textContent='اكتب كمية أكبر من صفر';return;}
      try{
        if(mgr){
          const r=addUpdates(S.wh,name,qty,unit);await DB.multi(r.up);closeModal();
          toast(r.merged?'✔ الصنف موجود — اتزادت الكمية':'✔ اتضاف الصنف','ok');
        }else{
          const w=$('#fw',m).value.trim();if(!w){err.textContent='اكتب اسمك';return;}
          saveName(w);
          await DB.multi({['requests/'+DB.key()]:{type:'add',wh:S.wh,worker:w,item:{name,qty,unit:unit||'قطعة'},status:'pending',ts:Date.now()}});
          closeModal();toast('✔ طلب الإضافة اتبعت للمدير','ok');
        }
      }catch(e){console.error(e);err.textContent='حصلت مشكلة — جرّب تاني';}
    }}
  ]);
}
function editItemModal(id){
  const it=S.items[id];if(!it)return;
  const cur=Object.assign({id},it,{qty:num(it.qty)});
  modal('تعديل الصنف',itemForm(cur)+'<div class="err" id="fe"></div>',[
    {t:'إلغاء',fn:closeModal},
    {t:'حفظ',cls:'pri',fn:async m=>{
      const name=$('#fn',m).value.trim(),unit=$('#fu',m).value.trim()||'قطعة',qv=$('#fq',m).value;
      if(!name){$('#fe',m).textContent='اكتب اسم الصنف';return;}
      const qty=Math.max(0,Math.floor(Number(qv))||0);
      try{await DB.multi({['items/'+id+'/name']:name,['items/'+id+'/qty']:qty,['items/'+id+'/unit']:unit});closeModal();toast('✔ اتحفظ','ok');}
      catch(e){$('#fe',m).textContent='حصلت مشكلة — جرّب تاني';}
    }}
  ]);
}
function delItemModal(id){
  const it=S.items[id];if(!it)return;
  modal('حذف صنف',`<p>متأكد إنك عايز تحذف «${esc(it.name)}» من ${whName(it.wh)}؟</p>`,[
    {t:'لا',fn:closeModal},
    {t:'حذف',cls:'bad',fn:async()=>{try{await DB.multi({['items/'+id]:null});delete S.cart[id];closeModal();toast('اتحذف','ok');}catch(e){toast('حصلت مشكلة','err');}}}
  ]);
}
async function approve(id){
  const r=S.reqs[id];if(!r||r.status!=='pending')return;
  let up={};
  if(r.type==='withdraw'){
    for(const l of (r.lines||[])){
      const it=S.items[l.id];
      if(!it){toast('الصنف «'+l.name+'» اتحذف من المخزن','err');return;}
      if(num(it.qty)<num(l.qty)){toast('الكمية مش كفاية في «'+l.name+'» (المتاح '+num(it.qty)+')','err');return;}
      up['items/'+l.id+'/qty']=num(it.qty)-num(l.qty);
    }
  }else if(r.type==='add'&&r.item){
    up=addUpdates(r.wh,r.item.name,num(r.item.qty),r.item.unit).up;
  }
  up['requests/'+id+'/status']='approved';up['requests/'+id+'/resolvedAt']=Date.now();
  try{await DB.multi(up);toast('✔ تمت الموافقة'+(r.type==='withdraw'?' واتخصمت الكمية':' واتضاف الصنف'),'ok');}
  catch(e){console.error(e);toast('حصلت مشكلة — جرّب تاني','err');}
}
async function reject(id){
  const r=S.reqs[id];if(!r||r.status!=='pending')return;
  try{await DB.multi({['requests/'+id+'/status']:'rejected',['requests/'+id+'/resolvedAt']:Date.now()});toast('اتسجّل كمرفوض — مفيش خصم','ok');}
  catch(e){toast('حصلت مشكلة — جرّب تاني','err');}
}

const ACT={
  pickwh(d){S.wh=d.id;showRole();},
  toPick(){showPick();},
  role(d){ if(d.r==='worker'){S.role='worker';enterMain();}else askPassword(); },
  sw(d){S.wh=d.id;S.q='';const q=$('#q');if(q)q.value='';render();},
  tab(d){S.tab=d.t;render();},
  filter(d){S.filter=d.f;renderList();},
  inc(d){setCart(d.id,num(S.cart[d.id])+1);renderList();},
  dec(d){setCart(d.id,num(S.cart[d.id])-1);renderList();},
  clear(){S.cart={};renderList();},
  confirm(){if(cartCount())askWorkerName();},
  add(){addItemModal();},
  edit(d){editItemModal(d.id);},
  del(d){delItemModal(d.id);},
  approve(d){approve(d.id);},
  reject(d){reject(d.id);},
  exit(){S.cart={};showPick();}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t||t.disabled)return;
  const f=ACT[t.dataset.act];if(f)f(t.dataset,t);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches&&t.matches('.step input')){
    setCart(t.dataset.id,t.value);
    const it=S.items[t.dataset.id],c=Math.min(num(S.cart[t.dataset.id]),num(it&&it.qty)),row=t.closest('.row');
    t.value=c;row.classList.toggle('sel',c>0);
    const [dec,inc]=row.querySelectorAll('.step button');dec.disabled=!c;inc.disabled=c>=num(it&&it.qty);
    patchBar();
  }
});

async function boot(){
  const c=FIREBASE_CONFIG;let demo=!(c.apiKey&&c.databaseURL);
  if(!demo){
    try{
      await loadScript('https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js');
      firebase.initializeApp(c);DB=FbDB();
    }catch(e){console.error(e);demo=true;toast('مفيش نت أو إعدادات Firebase غلط — شغال تجريبي','err');}
  }
  if(demo)DB=LocalDB;
  S.demo=demo;
  showPick();
  DB.sub('items',v=>{S.items=v||{};render();});
  DB.sub('requests',onReqs);
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
}
boot();
</script>
